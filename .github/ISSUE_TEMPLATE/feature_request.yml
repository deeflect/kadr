name: Feature request
description: Something you want Kadr to do
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: What do you want to do?
      description: The job you are trying to get done, not only the button you want.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
